<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TinyURL - Shorten. Share. Track.</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="landing-page">

    <!-- Background -->
    <div class="landing-background"></div>
    <div class="landing-overlay"></div>

    <!-- Top Navigation -->
    <header class="landing-header">

      <div class="landing-logo">
        TINYURL
      </div>

      <div class="landing-auth-buttons">

        <a href="login.html" class="landing-login-btn">
          Log In
        </a>

        <a href="signup.html" class="landing-signup-btn">
          Sign Up
        </a>

      </div>

    </header>


    <!-- Main Content -->
    <section class="landing-hero">

      <div class="landing-content">

        <span class="landing-label">
          SIMPLE • FAST • POWERFUL
        </span>

        <h1 id="landing-title">
          Shorten Long URLs in Seconds
        </h1>

        <p id="landing-description">
          Create short, simple and shareable links that are easy
          to remember and perfect for sharing anywhere.
        </p>

        <div class="landing-divider"></div>

        <div class="landing-slide-number">
          <span id="landing-slide">01</span>
          <span class="slide-total"> / 04</span>
        </div>

      </div>

    </section>

  </main>

<script src="auth.js" defer></script>
  <script src="landing.js"></script>

</body>
</html>
